---
title: Suspicious Certutil Download (WeakSup Seed)
status: experimental
logsource:
  product: windows
  category: process_creation
detection:
  selection:
Image|endswith: '\\cmd.exe'\n        CommandLine|contains|all:\n          - 'certutil'\n          - 'http'
  condition: selection
level: high

